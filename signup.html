<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | PoolPay</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172b4d;font:16px Arial,sans-serif}main{max-width:460px;margin:48px auto;padding:28px;background:white;border:1px solid #dce2ec;border-radius:18px}h1{font-size:28px}p{line-height:1.5}label{display:block;margin:18px 0 7px;font-weight:600}input,select,button{width:100%;padding:13px;border:1px solid #bcc7d9;border-radius:8px;font:inherit}button{margin-top:20px;background:#3157d5;color:white;cursor:pointer}button:disabled{opacity:.6}a{color:#3157d5}#message{white-space:pre-wrap} [hidden]{display:none!important}@media(max-width:500px){main{margin:20px 12px;padding:22px}}
  </style>
</head>
<body>
<main>
  <a href="index.html">← PoolPay home</a>
  <h1 id="signupTitle">Create your account</h1>
  <p id="signupDescription">Choose how you want to use PoolPay.</p>
  <div id="roleChoices">
    <button type="button" id="chooseManager">Sign up as manager</button>
    <p>Create pool groups and manage contributions.</p>
    <button type="button" id="chooseMember">Sign up as member</button>
    <p>View your contributions once your manager links you to a group.</p>
  </div>
  <button type="button" id="changeRole" hidden>Change account type</button>
  <p id="message" role="status" aria-live="polite"></p>
  <form id="signupForm" hidden>
    <label for="name">Full name</label>
    <input id="name" autocomplete="name" required maxlength="120">
    <label for="method">Register with</label>
    <select id="method"><option value="email">Email</option><option value="phone">Phone number</option></select>
    <label id="identityLabel" for="identity">Email address</label>
    <input id="identity" type="email" autocomplete="email" required>
    <label for="password">Password (at least 8 characters)</label>
    <input id="password" type="password" autocomplete="new-password" minlength="8" required>
    <label for="confirmPassword">Confirm password</label>
    <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit">Create account</button>
  </form>
  <form id="verifyForm" hidden>
    <label for="code">SMS verification code</label>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
    <button type="submit">Verify phone number</button>
    <button id="resend" type="button">Resend code</button>
  </form>
  <p>Already registered? <a href="index.html?login=1">Log in</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="signup.js"></script>
</body>
</html>
