<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#087e72"
  >

  <title>PoolPay | Dashboard</title>

  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

  <link

  >

  <link rel="stylesheet" href="manager-dashboard.css">
  <link rel="stylesheet" href="manager-portal.css">

    app.js renders either the Manager
    or Member dashboard inside this element.
  -->

  <div id="app">

      <div class="loading-bar" aria-hidden="true"></div>
      <div class="loading-bar" aria-hidden="true"></div>
    </div>

  </div>

    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>


  <!-- Shared PoolPay Supabase configuration -->

  <script src="supabase-config.js"></script>


  <!-- PoolPay application -->

  <script src="app.js"></script>
  <script src="manager-dashboard.js"></script>
  <script src="member-statement.js"></script>
  <script src="reminders.js"></script>
